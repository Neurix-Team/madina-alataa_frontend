# ═════════════════════════════════════════════════════════════════
# 🌐 Nginx Configuration for React SPA (Production-Ready)
# ═════════════════════════════════════════════════════════════════
# Project: بطل العطاء (Madina Al-Ataa)
# Purpose: Serve React application with optimal settings
# ═════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory where built React app is located
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────
    # 📝 Logging Configuration
    # ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ─────────────────────────────────────────────────────────────
    # 🗜️ Compression Settings (Gzip)
    # ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ─────────────────────────────────────────────────────────────
    # 🔒 Security Headers
    # ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Content Security Policy (adjust based on your needs)
    # Tightened Content Security Policy: remove 'unsafe-inline' and 'unsafe-eval' for scripts.
    # If your app requires inline scripts, prefer nonces or hashed scripts instead of 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com;" always;

    # ─────────────────────────────────────────────────────────────
    # 📦 Static Assets Caching
    # ─────────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Special handling for Vite's hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────
    # 🔄 SPA Routing (React Router Support)
    # ─────────────────────────────────────────────────────────────
    # All routes should serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ─────────────────────────────────────────────────────────────
    # 🏥 Health Check Endpoint
    # ─────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─────────────────────────────────────────────────────────────
    # 🚫 Deny Access to Hidden Files
    # ─────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─────────────────────────────────────────────────────────────
    # 📊 Additional Performance Settings
    # ─────────────────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    keepalive_timeout 65;
    send_timeout 60;
}
