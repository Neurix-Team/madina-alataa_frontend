# Project: بطل العطاء (Madina Al-Ataa)
# Services: Frontend (React), Backend (.NET), Database (PostgreSQL)
# ═════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # 🎨 Frontend Service (React + Nginx)
  # ─────────────────────────────────────────────────────────────
  frontend:
    container_name: madina-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - madina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.madina.service=frontend"
      - "com.madina.description=React application for بطل العطاء"

