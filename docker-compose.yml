services:
  # Development — hot reload on port 5173
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://champapi.neurix.uk:5001}
    profiles:
      - dev

  # Production — nginx on port 80
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://champapi.neurix.uk:5001}
    ports:
      - "9080:80"
    profiles:
      - prod
